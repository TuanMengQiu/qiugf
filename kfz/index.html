    <style>
        /* 重置所有元素默认边距和内边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 遮罩层样式 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* 灰色透明背景 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            z-index: 1000; /* 确保在最上层 */
            cursor: pointer;
        }
        
        /* 图片样式 - 移除所有边框相关样式 */
        .modal-image {
            max-width: 90%;
            max-height: 90%;
            /* 关键：移除所有边框和轮廓 */
            border: none;
            outline: none;
            /* 移除可能的阴影（如果不需要） */
            box-shadow: none;
        }
    </style>
</head>
<body>
  <div id="app">秋秋正在努力加载中</div>
      <div class="overlay" id="overlay">

      <script>
        const overlay = document.getElementById('overlay');
        const modalImage = document.getElementById('modalImage');
        
        // 点击遮罩层关闭
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
        });
        
        // 点击图片关闭
        modalImage.addEventListener('click', (e) => {
            e.stopPropagation();
            overlay.style.display = 'none';
        });
    </script>
