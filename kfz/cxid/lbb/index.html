<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID查询器</title>
  <link rel="shortcut icon" href="..\..\..\static\picture\a4Vyng.jpg" type="image/x-icon">
  <link rel="bookmark" href="..\..\..\static\picture\a4Vyng.jpg">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://tuanmengqiu.cn/cx/img/bj.png') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 20px;
      color: #fff;
    }
    .container {
      width: 80%;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.8); /* 半透明背景 */
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5); /* 半透明边框 */
    }
    .search-wrapper {
      display: flex;
      align-items: center;
    }
    input[type="text"] {
      width: calc(100% - 90px);
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.5); /* 半透明边框 */
      border-radius: 4px;
      font-size: 16px;
      margin-right: 10px;
    }
    button {
      width: 80px;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #4dc497;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #7deac0;
    }
    #content {
      white-space: pre-wrap;
      border: 1px solid rgba(255, 255, 255, 0.5); /* 半透明边框 */
      padding: 20px;
      margin-top: 20px;
      height: 400px;
      overflow-y: auto;
      background-color: rgba(250, 250, 250, 0.8); /* 半透明背景 */
      border-radius: 4px;
    }
    .highlight {
      background-color: #ffeb3b;
      border-radius: 3px;
      cursor: pointer;
    }
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.5); /* 半透明边框 */
      border-radius: 4px;
      font-size: 16px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.8); /* 半透明背景 */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="color: #000000;">ID查询器</h1>
    <div class="search-wrapper">
      <input type="text" id="search-box" placeholder="输入搜索内容..." onkeydown="handleKeyDown(event)">
      <button onclick="searchText()">搜索</button>
    </div>
    <div id="content"></div>
    <select id="file-select" onchange="loadFile()">
      <option value="道具.txt">道具</option>
      <option value="方块.txt">方块</option>
      <option value="生物.txt">生物</option>
      <option value="生物模型.txt">生物模型</option>
      <option value="坐骑.txt">坐骑</option>
      <option value="投掷物.txt">投掷物</option>
      <option value="配方.txt">配方</option>
      <option value="动作.txt">动作</option>
      <option value="表情.txt">表情</option>
      <option value="新附魔.txt">新附魔</option>
      <option value="旧附魔.txt">旧附魔</option>
      <option value="音效.txt">音效</option>
      <option value="Buff.txt">Buff</option>
      <option value="特效.txt">特效</option>
      <option value="特效路径.txt">特效路径</option>
      <option value="皮肤.txt">皮肤</option>
      <option value="自定义装扮.txt">自定义装扮</option>
      <option value="渠道.txt">apiid</option>
      <option value="成就.txt">成就</option>
      <option value="颜料瓶.txt">颜料瓶</option>
      <option value="UI图片.txt">UI图片</option>
      <option value="自定义效果.txt">自定义效果</option>
      <option value="熔炼.txt">熔炼</option>
    </select>
  </div>
  
  <script>
    let currentFileContent = '';
    
    async function loadFile() {
      const fileSelect = document.getElementById('file-select');
      const fileName = fileSelect.value;
      try {
        const response = await fetch(fileName);
        if (!response.ok) throw new Error('网络错误');
        currentFileContent = await response.text();
        document.getElementById('content').innerHTML = formatContent(currentFileContent);
      } catch (error) {
        console.error('加载文件失败:', error);
        document.getElementById('content').textContent = '文件加载失败';
      }
    }

    function formatContent(content) {
      return content.split('\n').map(line => `<div onclick="copyToClipboard(this)">${line}</div>`).join('<br>');
    }

    function searchText() {
      const searchBox = document.getElementById('search-box');
      const query = searchBox.value.trim();
      if (query) {
        const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'); // Escape special characters
        const regex = new RegExp(escapedQuery, 'gi');
        const highlightedContent = currentFileContent.replace(regex, match => `<span class="highlight">${match}</span>`);
        document.getElementById('content').innerHTML = formatContent(highlightedContent);
        setTimeout(() => highlightPosition(), 0); // Delay scroll for rendering
      }
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        searchText();
      }
    }

    function highlightPosition() {
      const contentDiv = document.getElementById('content');
      const spans = contentDiv.querySelectorAll('span.highlight');
      if (spans.length > 0) {
        spans[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function copyToClipboard(element) {
      const text = element.textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('复制成功: ' + text);
      }).catch(err => {
        console.error('复制失败:', err);
      });
    }

    // Load the default file on page load
    window.onload = loadFile;
  </script>
</body>
</html>
