<!DOCTYPE html>
<html>
<head>
	<title>迷你世界物品ID图鉴查询器</title>
	<meta charset="UTF-8">
    <link rel="shortcut icon" href="..\..\static\picture\a4Vyng.jpg" type="image/x-icon">
    <link rel="bookmark" href="..\..\static\picture\a4Vyng.jpg">
<style>
    /* 设置滚动条整体宽度和颜色 */
    .detail-panel,
    .items-container {
      scrollbar-width: thin; 
      scrollbar-color: #4dc497 rgba(255, 255, 255, 0.2);
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    body {
        font-family: Arial, sans-serif;
        background: url('https://tuanmengqiu.cn/cx/img/bj.png') no-repeat center center fixed;
        background-size: cover;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;


    }

    .app-container {
        display: flex;
        gap: 20px;
        height: calc(100vh - 120px);
    }

    .detail-panel {
        flex: 1;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        position: relative;
        transition: opacity 0.3s ease;
    }

    .back-button {
        position: absolute;
        top: 20px;
        right: 20px;
        width: auto;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 18px;
        display: none;
    }

    .back-button:hover {
        background-color: #7deac0;
    }

    .detail-placeholder {
        text-align: center;
        color: #666;
        padding: 40px 20px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .detail-placeholder img {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        opacity: 0.5;
    }

    .detail-content {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        flex-grow: 1;
        display: none;
        flex-direction: column;
        padding-top: 10px;
    }

    .detail-icon {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: block;
        /*box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);*/
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .detail-icon:hover {
        transform: scale(1.05);
        /*box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);*/
    }

    .detail-info {
        margin: 15px 0;
        padding: 10px 15px;
        background-color: #f9f9f9;
        border-radius: 6px;
        border-left: 4px solid #4dc497;
        cursor: pointer;
        transition: background-color 0.2s;
        position: relative;
    }

    .detail-info:hover {
        background-color: #f0f9f5;
    }

    .detail-info:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        top: -30px;
        left: 20px;
        background-color: #333;
        color: white;
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 12px;
        white-space: nowrap;
        z-index: 10;
    }

    .detail-info:hover::before {
        content: '';
        position: absolute;
        top: -10px;
        left: 25px;
        border-width: 0 5px 5px 5px;
        border-style: solid;
        border-color: transparent transparent #333 transparent;
        z-index: 10;
    }

    .detail-info strong {
        color: #4dc497;
        display: inline-block;
        width: 80px;
    }

    .detail-desc {
        margin-top: 20px;
        padding: 15px;
        background-color: #f0f9f5;
        border-radius: 6px;
        line-height: 1.6;
        flex-grow: 1;
        cursor: pointer;
        position: relative;
        transition: background-color 0.2s;
    }

    .detail-desc:hover {
        background-color: #e6f7f0;
    }

    /* 描述区域的提示框样式 */
    .detail-desc:hover::after {
        content: "点击绿框复制描述点击图标跳转物品";
        position: absolute;
        top: -30px;
        left: 20px;
        background-color: #333;
        color: white;
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 12px;
        white-space: nowrap;
        z-index: 10;
    }

    .detail-desc:hover::before {
        content: '';
        position: absolute;
        top: -10px;
        left: 25px;
        border-width: 0 5px 5px 5px;
        border-style: solid;
        border-color: transparent transparent #333 transparent;
        z-index: 10;
    }

    .list-panel {
        width: 450px;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
    }

    .search-wrapper {
        display: flex;
        margin-bottom: 20px;
    }

    input[type="text"] {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px 0 0 4px;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        border: none;
        background-color: #4dc497;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    button:hover {
        background-color: #7deac0;
    }

    button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
    }

    .search-button {
        border-radius: 0 4px 4px 0;
    }

    .search-info {
        font-size: 14px;
        color: #666;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
    }

    .items-container {
        overflow-y: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        position: relative;
    }

    .item-small {
        width: calc(25% - 8px);
        height: 110px;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        padding: 8px;
        border-radius: 6px;
        transition: all 0.2s;
        position: relative;
    }

    .item-small:hover {
        background-color: #f0f9f5;
        transform: translateY(-2px);
    }

    .item-small.selected {
        background-color: #e6f7f0;
        /*box-shadow: 0 0 0 2px #4dc497;*/
        transform: scale(1.05);
    }

    .item-small .id {
        font-size: 11px;
        color: #666;
        margin-bottom: 5px;
        text-align: center;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .item-small img {
        width: 55px;
        height: 55px;
        border-radius: 4px;
        margin-bottom: 8px;
        flex-shrink: 0;
        background-color: #f0f0f0;
        border-radius:50%;
    }

    .item-small .name {
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .pagination {
        display: none;
    }

    .copy-hint {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #4dc497;
        color: white;
        padding: 10px 20px;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 1000;
    }

    .copy-hint.active {
        opacity: 1;
    }

    .inline-item-icon {
        width: 30px !important;
        height: 30px !important;
        border-radius: 2px;
        margin: 0 3px;
        vertical-align: middle;
        cursor: pointer;
    }

    .inline-item-name {
        color: #4dc497;
        cursor: pointer;
    }

    .color-text {
        display: inline;
    }

    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal {
        background-color: white;
        border-radius: 10px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        overflow: hidden;
    }

    .modal-header {
        background-color: #4dc497;
        color: white;
        padding: 15px 20px;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .modal-close {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        width: auto;
        padding: 0;
    }

    .modal-body {
        padding: 20px;
        text-align: center;
    }

    .modal-body img {
        width: 200px;
        height: 200px;
        margin-bottom: 15px;
    }

    .modal-message {
        font-size: 16px;
        line-height: 1.6;
    }

    .modal-footer {
        padding: 15px 20px;
        background-color: #f9f9f9;
        text-align: right;
        border-top: 1px solid #eee;
    }

    .loading-indicator {
        text-align: center;
        padding: 15px;
        display: none;
    }

    .loading-indicator.active {
        display: block;
    }

    .spinner {
        border: 3px solid rgba(77, 196, 151, 0.3);
        border-radius: 50%;
        border-top: 3px solid #4dc497;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* 图片错误默认图 */
    .item-small img.error,
    .inline-item-icon.error,
    .detail-icon.error {
        content: url('../cxid/ico/nil.png');
    }
</style>
</head>
<body>
	<h1>迷你世界物品ID图鉴</h1>
	
	<div class="app-container">
        <!-- 左侧详情面板 -->
        <div class="detail-panel">
            <button class="back-button" id="backButton">←</button>
            
            <div class="detail-placeholder" id="detailPlaceholder">
                <img src="../qqgfapp/icon.png" alt="选择物品">
                <h3>图鉴适配游戏版本号:1.48.0</h3>
                <p>点击右侧物品查看详细信息</p>
            </div>
            
            <div class="detail-content" id="detailContent">
                <img src="" alt="物品图标" class="detail-icon" id="detailIcon" title="点击复制ID">
                
                <div class="detail-info" id="detailIdContainer" data-tooltip="点击复制ID">
                    <strong>ID：</strong>
                    <span id="detailId"></span>
                </div>
                
                <div class="detail-info" id="detailNameContainer" data-tooltip="点击复制名称">
                    <strong>名称：</strong>
                    <span id="detailName"></span>
                </div>
                
                <div class="detail-info" id="detailTypeContainer" data-tooltip="点击复制类型">
                    <strong>类型：</strong>
                    <span id="detailType"></span>
                </div>
                
                <div class="detail-desc">
                    <strong>描述：</strong>
                    <div id="detailDesc"></div>
                </div>
            </div>
        </div>
        
        <!-- 右侧列表面板 -->
        <div class="list-panel">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="输入关键词或ID">
                <button class="search-button" id="searchButton">搜索</button>
            </div>
            
            <div class="search-info" id="searchInfo"></div>
            
            <div class="items-container" id="itemsContainer"></div>
            
            <div class="loading-indicator" id="loadingIndicator">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>
            
            <div class="pagination" id="pagination" style="display:none;">
                <button id="prevPage">上一页</button>
                <span>第 <input type="number" id="pageInput" min="1" value="1"> 页 / 共 <span id="totalPages">0</span> 页</span>
                <button id="nextPage">下一页</button>
                <button id="goPage">跳转</button>
            </div>
        </div>
    </div>
	
	<div class="copy-hint" id="copyHint">秋秋已帮您复制到剪贴板</div>
	
	<div class="modal-overlay" id="hintModal">
		<div class="modal">
			<div class="modal-header">
				<span>提示信息</span>
				<button class="modal-close" id="hintModalClose">&times;</button>
			</div>
			<div class="modal-body" id="hintModalBody">
				<img src="../cxid/ico/无搜索内容.gif" alt="提示">
				<div class="modal-message">提示信息内容</div>
			</div>
			<div class="modal-footer">
				<button id="hintModalConfirm">确定</button>
			</div>
		</div>
	</div>
	
	<script>
		let allItems = [];
		const existingIcons = new Set();
		let currentPage = 1;
		const pageSize = 100;
		let filteredItems = [];
		let selectedItem = null;
		let isLoading = false;
		let hasMoreItems = true;
		let navigationHistory = [];
		let loadRetries = 0;
		const maxLoadRetries = 3;
		
		const itemDomCache = new Map();
		let imageObserver;
		
		const colorShortcuts = {
			'#G': '#4dc497', '#R': '#ff0000', '#Y': '#d8d80c', 
			'#B': '#25a4ff', '#K': '#000000', '#W': '#ffffff'
		};
		
		// DOM元素
		const itemsContainer = document.getElementById('itemsContainer');
		const searchInput = document.getElementById('searchInput');
		const searchButton = document.getElementById('searchButton');
		const searchInfo = document.getElementById('searchInfo');
		const copyHint = document.getElementById('copyHint');
		const loadingIndicator = document.getElementById('loadingIndicator');
		const backButton = document.getElementById('backButton');
		
		const detailPlaceholder = document.getElementById('detailPlaceholder');
		const detailContent = document.getElementById('detailContent');
		const detailIcon = document.getElementById('detailIcon');
		const detailId = document.getElementById('detailId');
		const detailName = document.getElementById('detailName');
		const detailType = document.getElementById('detailType');
		const detailDesc = document.getElementById('detailDesc');
		const detailIdContainer = document.getElementById('detailIdContainer');
		const detailNameContainer = document.getElementById('detailNameContainer');
		const detailTypeContainer = document.getElementById('detailTypeContainer');
		
		const hintModal = document.getElementById('hintModal');
		const hintModalBody = document.getElementById('hintModalBody');
		const hintModalClose = document.getElementById('hintModalClose');
		const hintModalConfirm = document.getElementById('hintModalConfirm');
		
		// 显示复制提示
		function showCopyHint() {
			copyHint.classList.add('active');
			setTimeout(() => copyHint.classList.remove('active'), 2000);
		}
		
		// 复制到剪贴板
		function copyToClipboard(text, label) {
			if (!text) return;
			
			if (navigator.clipboard) {
				navigator.clipboard.writeText(text)
					.then(() => {
						console.log(`${label}已复制`);
						showCopyHint();
					})
					.catch(err => {
						console.error('Clipboard API失败:', err);
						fallbackCopy(text, label);
					});
			} else {
				fallbackCopy(text, label);
			}
		}
		
		// 复制降级方案
		function fallbackCopy(text, label) {
			const tempElement = document.createElement('textarea');
			tempElement.value = text;
			tempElement.style.position = 'absolute';
			tempElement.style.left = '-9999px';
			document.body.appendChild(tempElement);
			
			tempElement.select();
			tempElement.setSelectionRange(0, 99999);
			
			try {
				const successful = document.execCommand('copy');
				if (successful) {
					console.log(`${label}已复制 (备用方法)`);
					showCopyHint();
				}
			} catch (err) {
				console.error('复制失败:', err);
			} finally {
				document.body.removeChild(tempElement);
			}
		}

		// 获取物品图标URL
		function getIconUrl(itemId) {
			return `../cxid/ico/${itemId}.png`;
		}
		
		// 关闭提示模态框
		function closeHintModal() {
			hintModal.classList.remove('active');
		}
		
		// 显示提示模态框
		function showHintModal(message, imageUrl = '../cxid/ico/nil.png') {
			const hintImg = hintModalBody.querySelector('img');
			const messageDiv = hintModalBody.querySelector('.modal-message');
			
			hintImg.src = imageUrl;
			hintImg.alt = '提示信息';
			hintImg.onerror = () => hintImg.src = '../cxid/ico/nil.png';
			
			messageDiv.textContent = message;
			hintModal.classList.add('active');
		}
		
		// 解析文本格式
		function parseColorText(text) {
			if (!text) return '';
			
			let processedText = text;
			Object.keys(colorShortcuts).forEach(shortcut => {
				const regex = new RegExp(`${shortcut}(.*?)(#n|@|#c|$)`, 'g');
				processedText = processedText.replace(regex, (match, content, endMarker) => {
					const marker = endMarker === '#n' ? '' : endMarker;
					return `<span style="color: ${colorShortcuts[shortcut]};" class="color-text">${content}</span>${marker}`;
				});
			});
			
			const colorRegex = /#c([0-9a-fA-F]{6})(.*?)(#n|@|#c|$)/g;
			if (colorRegex.test(processedText)) {
				processedText = processedText.replace(colorRegex, (match, colorCode, content, endMarker) => {
					const marker = endMarker === '#n' ? '' : endMarker;
					return `<span style="color: #${colorCode};" class="color-text">${content}</span>${marker}`;
				});
			}
			
			return processedText;
		}

		function parseLineBreaks(text) {
			return text ? text.replace(/#r/g, '<br>') : '';
		}

		// 解析物品标签并绑定点击事件
        function parseItemTags(text) {
            if (!text) return '';
            const itemRegex = /@item_(\d+)#?/g;  // 新增?，让#变为可选（0次或1次匹配）
            return text.replace(itemRegex, (match, itemId) => {
                // 解析逻辑不变，仍基于提取的itemId处理
                const item = allItems.find(i => i.id === itemId);
                const tooltip = item ? `名称: ${item.name} | ID: ${item.id}` : `ID: ${itemId}`;
                const name = item ? item.name : `ID: ${itemId}`;
                
                return `<img src="../cxid/ico/nil.png" 
                            data-src="${getIconUrl(itemId)}"
                            alt="${name}" 
                            class="inline-item-icon lazyload" 
                            data-item-id="${itemId}"
                            title="${tooltip}">
                        <span class="inline-item-name" 
                            data-item-id="${itemId}"
                            title="${tooltip}">${name}</span>`;
            });
        }
		
		// 检查物品是否已加载
		function isItemLoaded(itemId) {
			return itemDomCache.has(itemId);
		}
		
		// 重置加载重试计数器
		function resetLoadRetries() {
			loadRetries = 0;
		}
		
		// 加载直到找到指定物品
		function loadUntilItemFound(itemId, callback) {
			if (isItemLoaded(itemId)) {
				resetLoadRetries();
				callback(true);
				return;
			}
			
			if (!hasMoreItems || loadRetries >= maxLoadRetries) {
				resetLoadRetries();
				callback(false);
				return;
			}
			
			if (isLoading) {
				setTimeout(() => {
					loadRetries++;
					loadUntilItemFound(itemId, callback);
				}, 300);
				return;
			}
			
			renderMoreItems(() => {
				loadRetries++;
				loadUntilItemFound(itemId, callback);
			});
		}
		
		// 自动搜索并选择物品
		function autoSearchAndSelect(item) {
			saveCurrentState();
			searchInput.value = item.name;
			
			const keyword = item.name.trim().toLowerCase();
			const regex = new RegExp(keyword, 'i');
			filteredItems = allItems.filter(item => 
				regex.test(item.name) || regex.test(item.id) || regex.test(item.type)
			);
			
			if (filteredItems.length > 0) {
				itemsContainer.innerHTML = '';
				itemDomCache.clear();
				currentPage = 1;
				hasMoreItems = true;
				loadingIndicator.innerHTML = '<div class="spinner"></div><div>加载中...</div>';
				
				renderMoreItems(() => {
					selectItem(item.id, false, false);
				});
				
				searchInfo.textContent = `找到 ${filteredItems.length} 个结果: "${keyword}"`;
			} else {
				itemsContainer.innerHTML = '';
				itemDomCache.clear();
				searchInfo.textContent = `没有找到包含 "${keyword}" 的物品`;
				showHintModal('秋秋找不到呢，请换一个试试！', '../cxid/ico/无搜索内容.gif');
			}
		}
		
		// 保存当前状态到历史记录
		function saveCurrentState() {
			if (navigationHistory.length === 0 || 
				navigationHistory[navigationHistory.length - 1].itemId !== selectedItem?.id) {
				
				navigationHistory.push({
					itemId: selectedItem ? selectedItem.id : null,
					searchTerm: searchInput.value,
					filteredItems: [...filteredItems],
					scrollPosition: itemsContainer.scrollTop
				});
				updateBackButtonVisibility();
			}
		}
		
		// 选择物品并显示详情
		function selectItem(itemId, addToHistory = true, fromDescription = false) {
			const item = allItems.find(i => i.id === itemId);
			if (!item) {
				showHintModal(`未找到ID为 ${itemId} 的物品`);
				return;
			}
			
			if (fromDescription) {
				autoSearchAndSelect(item);
				return;
			}
			
			if (addToHistory) {
				saveCurrentState();
			}
			
			resetLoadRetries();
			
			if (!isItemLoaded(itemId)) {
				loadingIndicator.classList.add('active');
				
				loadUntilItemFound(itemId, (found) => {
					loadingIndicator.classList.remove('active');
					
					if (found) {
						completeItemSelection(item);
					} else {
						showHintModal(`物品 ${item.name} 存在，但加载时发生错误`);
						completeItemSelection(item, true);
					}
				});
			} else {
				completeItemSelection(item);
			}
		}
		
		// 完成物品选择的后续操作
		function completeItemSelection(item, forceDisplay = false) {
			document.querySelectorAll('.item-small').forEach(el => {
				el.classList.remove('selected');
			});
			
			if (!forceDisplay) {
				const selectedElement = document.querySelector(`.item-small[data-id="${item.id}"]`);
				if (selectedElement) {
					selectedElement.classList.add('selected');
					selectedElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
				}
			}
			
			detailPlaceholder.style.display = 'none';
			detailContent.style.display = 'flex';
			
			detailIcon.src = '../cxid/ico/nil.png';
			detailIcon.dataset.src = getIconUrl(item.id);
			detailIcon.classList.add('lazyload');
			loadLazyImage(detailIcon);
			
			detailId.textContent = item.id;
			detailName.textContent = item.name;
			detailType.textContent = item.type;
			
			let parsedMsg = item.msg;
			parsedMsg = parseLineBreaks(parsedMsg);
			parsedMsg = parseColorText(parsedMsg);
			parsedMsg = parseItemTags(parsedMsg);
			
			let displayMsg = parsedMsg;
			if (!item.msg || item.msg.trim() === '') {
				displayMsg = '快去下载最新的游戏版本吧!';
			}
			
			detailDesc.innerHTML = displayMsg;
			initLazyLoadInDescription();
			
			selectedItem = item;
		}
		
		// 返回上一级
		function goBack() {
			if (navigationHistory.length > 0) {
				const prevState = navigationHistory.pop();
				updateBackButtonVisibility();
				
				if (prevState.itemId) {
					const prevItem = allItems.find(i => i.id === prevState.itemId);
					if (prevItem) {
						detailContent.style.display = 'flex';
						detailPlaceholder.style.display = 'none';
						
						detailIcon.src = '../cxid/ico/nil.png';
						detailIcon.dataset.src = getIconUrl(prevItem.id);
						detailIcon.classList.add('lazyload');
						loadLazyImage(detailIcon);
						
						detailId.textContent = prevItem.id;
						detailName.textContent = prevItem.name;
						detailType.textContent = prevItem.type;
						
						let parsedMsg = prevItem.msg;
						parsedMsg = parseLineBreaks(parsedMsg);
						parsedMsg = parseColorText(parsedMsg);
						parsedMsg = parseItemTags(parsedMsg);
						
						detailDesc.innerHTML = parsedMsg || '快去下载最新的游戏版本吧!';
						initLazyLoadInDescription();
						
						selectedItem = prevItem;
					}
				} else {
					detailContent.style.display = 'none';
					detailPlaceholder.style.display = 'flex';
					selectedItem = null;
				}
				
				queueMicrotask(() => {
					const currentScrollPos = itemsContainer.scrollTop;
					
					searchInput.value = prevState.searchTerm;
					filteredItems = [...prevState.filteredItems];
					
					itemsContainer.innerHTML = '';
					itemDomCache.clear();
					currentPage = 1;
					hasMoreItems = true;
					
					if (filteredItems.length > 0) {
						renderMoreItems(() => {
							if (prevState.itemId) {
								const prevItemEl = document.querySelector(`.item-small[data-id="${prevState.itemId}"]`);
								if (prevItemEl) {
									prevItemEl.classList.add('selected');
								}
							}
							
							setTimeout(() => {
								itemsContainer.scrollTop = prevState.scrollPosition;
							}, 50);
						});
						
						searchInfo.textContent = prevState.searchTerm 
							? `找到 ${filteredItems.length} 个结果: "${prevState.searchTerm}"`
							: `共 ${allItems.length} 个物品`;
					} else {
						searchInfo.textContent = prevState.searchTerm 
							? `没有找到包含 "${prevState.searchTerm}" 的物品`
							: `共 ${allItems.length} 个物品`;
					}
				});
			}
		}
		
		// 更新返回按钮可见性
		function updateBackButtonVisibility() {
			backButton.style.display = navigationHistory.length > 0 ? 'block' : 'none';
		}
		
		// 初始化描述中的图片懒加载
		function initLazyLoadInDescription() {
			const lazyImages = detailDesc.querySelectorAll('.lazyload');
			lazyImages.forEach(img => {
				img.onerror = function() {
					this.classList.add('error');
				};
				if (imageObserver) {
					imageObserver.observe(img);
				} else {
					loadLazyImage(img);
				}
			});
		}
		
		// 处理描述中物品的点击事件
		function handleInlineItemClick(e) {
			const target = e.target.closest('.inline-item-icon, .inline-item-name, .color-text');
			if (target) {
				e.stopPropagation(); // 阻止事件冒泡到绿色区域
				const itemId = target.getAttribute('data-item-id') || 
							  target.parentElement?.getAttribute('data-item-id');
				if (itemId) {
					selectItem(itemId, true, true);
				}
			}
		}
		
		// 加载懒加载图片
		function loadLazyImage(img) {
			if (img.dataset.src && img.src !== img.dataset.src) {
				img.src = img.dataset.src;
				img.removeAttribute('data-src');
				img.classList.remove('lazyload');
			}
		}
		
		// 初始化图片懒加载
		function initLazyLoad() {
			if ('IntersectionObserver' in window) {
				imageObserver = new IntersectionObserver((entries, observer) => {
					entries.forEach(entry => {
						if (entry.isIntersecting) {
							const img = entry.target;
							loadLazyImage(img);
							observer.unobserve(img);
						}
					});
				}, {
					rootMargin: '50px 0px',
					threshold: 0.01
				});
			}
		}
		
		// 渲染更多物品
		function renderMoreItems(callback) {
			if (isLoading || !hasMoreItems) {
				if (callback) callback();
				return;
			}
			
			isLoading = true;
			loadingIndicator.classList.add('active');
			
			requestAnimationFrame(() => {
				const startIndex = (currentPage - 1) * pageSize;
				const endIndex = Math.min(startIndex + pageSize, filteredItems.length);
				const itemsToRender = filteredItems.slice(startIndex, endIndex);
				
				const fragment = document.createDocumentFragment();
				
				itemsToRender.forEach(item => {
					if (!itemDomCache.has(item.id)) {
						const itemElement = document.createElement('div');
						itemElement.className = `item-small ${selectedItem && selectedItem.id === item.id ? 'selected' : ''}`;
						itemElement.setAttribute('data-id', item.id);
						
						itemElement.innerHTML = `
							<div class="id">${item.id}</div>
							<img src="../cxid/ico/nil.png" 
								 data-src="${getIconUrl(item.id)}" 
								 alt="${item.name}" 
								 class="lazyload">
							<div class="name">${item.name}</div>
						`;
						
						const img = itemElement.querySelector('img');
						img.onerror = function() {
							this.classList.add('error');
						};
						
						itemDomCache.set(item.id, itemElement);
						fragment.appendChild(itemElement);
						
						if (imageObserver) {
							imageObserver.observe(img);
						} else {
							loadLazyImage(img);
						}
					}
				});
				
				itemsContainer.appendChild(fragment);
				
				if (endIndex >= filteredItems.length) {
					hasMoreItems = false;
					loadingIndicator.innerHTML = '<div>已加载全部内容</div>';
				} else {
					currentPage++;
					loadingIndicator.innerHTML = '<div class="spinner"></div><div>加载中...</div>';
				}
				
				isLoading = false;
				loadingIndicator.classList.remove('active');
				
				if (callback) callback();
			});
		}
		
		// 重置列表并加载第一页
		function resetAndLoadItems() {
			itemsContainer.innerHTML = '';
			itemDomCache.clear();
			currentPage = 1;
			hasMoreItems = true;
			loadingIndicator.innerHTML = '<div class="spinner"></div><div>加载中...</div>';
			renderMoreItems();
		}
		
		// 搜索功能
		function performSearch() {
			const keyword = searchInput.value.trim().toLowerCase();
			if (keyword) {
				const regex = new RegExp(keyword, 'i');
				filteredItems = allItems.filter(item => 
					regex.test(item.name) || regex.test(item.id) || regex.test(item.type)
				);
				
				if (filteredItems.length > 0) {
					resetAndLoadItems();
					searchInfo.textContent = `找到 ${filteredItems.length} 个结果: "${keyword}"`;
				} else {
					itemsContainer.innerHTML = '';
					itemDomCache.clear();
					searchInfo.textContent = `没有找到包含 "${keyword}" 的物品`;
					showHintModal('秋秋找不到呢，请换一个试试！', '../cxid/ico/无搜索内容.gif');
					isLoading = false;
					hasMoreItems = true;
					loadingIndicator.classList.remove('active');
				}
			} else {
				filteredItems = [...allItems];
				resetAndLoadItems();
				searchInfo.textContent = `共 ${allItems.length} 个物品`;
			}
		}
		
		// 绑定无限滚动事件
		function bindScrollEvent() {
			let scrollTimeout;
			itemsContainer.addEventListener('scroll', () => {
				clearTimeout(scrollTimeout);
				scrollTimeout = setTimeout(() => {
					if (!isLoading && hasMoreItems && 
						itemsContainer.scrollHeight - itemsContainer.scrollTop - itemsContainer.clientHeight < 200) {
						renderMoreItems();
					}
				}, 100);
			});
		}
		
		// 绑定复制事件 - 重点修复部分
		function bindCopyEvents() {
			// 其他复制事件保持不变
			detailIcon.addEventListener('click', () => {
				if (selectedItem) {
					copyToClipboard(selectedItem.id, '物品ID');
				}
			});
			
			detailIdContainer.addEventListener('click', () => {
				if (selectedItem) {
					copyToClipboard(selectedItem.id, '物品ID');
				}
			});
			
			detailNameContainer.addEventListener('click', () => {
				if (selectedItem) {
					copyToClipboard(selectedItem.name, '物品名称');
				}
			});
			
			detailTypeContainer.addEventListener('click', () => {
				if (selectedItem) {
					copyToClipboard(selectedItem.type, '物品类型');
				}
			});
			
			// 描述区域的点击事件处理 - 修复部分
			const descContainer = document.querySelector('.detail-desc');
			descContainer.addEventListener('click', (e) => {
				// 检查点击目标是否是内部可交互元素
				const isInteractiveElement = e.target.closest('.inline-item-icon, .inline-item-name, .color-text');
				
				// 如果不是交互元素，则执行复制
				if (!isInteractiveElement) {
					if (selectedItem) {
						const textToCopy = selectedItem.msg && selectedItem.msg.trim() !== '' 
							? selectedItem.msg 
							: '快去下载最新的游戏版本吧!';
						copyToClipboard(textToCopy, '物品描述');
					}
				}
			});
			
			// 为内部元素绑定点击事件
			descContainer.addEventListener('click', handleInlineItemClick);
		}
		
		// 初始化
		function init() {
			initLazyLoad();
			bindScrollEvent();
			bindCopyEvents();
			
			itemsContainer.addEventListener('click', (e) => {
				const itemEl = e.target.closest('.item-small');
				if (itemEl) {
					const itemId = itemEl.getAttribute('data-id');
					selectItem(itemId, true, false);
				}
			});
		}
		
		// 绑定事件
		searchButton.addEventListener('click', performSearch);
		searchInput.addEventListener('keypress', (e) => {
			if (e.key === 'Enter') performSearch();
		});
		backButton.addEventListener('click', goBack);
		
		hintModalClose.addEventListener('click', closeHintModal);
		hintModalConfirm.addEventListener('click', closeHintModal);
		hintModal.addEventListener('click', (e) => {
			if (e.target === hintModal) closeHintModal();
		});
		
		// 加载物品数据
		fetch('../cxid/id.txt')
			.then(response => {
				if (!response.ok) throw new Error('网络响应不正常');
				return response.text();
			})
			.then(data => {
				allItems = data.trim().split('\n').map(line => {
					const [id, name, type, msg] = line.replace(/[{}]/g, '').split(',');
					return { id, name, type, msg: msg || '' };
				});
				
				filteredItems = [...allItems];
				resetAndLoadItems();
				searchInfo.textContent = `共 ${allItems.length} 个物品`;
				init();
			})
			.catch(error => {
				console.error('读取数据失败:', error);
				showHintModal('读取服务器数据时发生错误。', '../cxid/ico/无搜索内容.gif');
				isLoading = false;
				loadingIndicator.classList.remove('active');
			});
	</script>
</body>
</html>
