    <style>
        /* 基础样式简化 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; overflow-x: hidden; }
        #poster { width: 100%; margin-top: auto; }
        
        /* 顶部Banner区域 */
        .banner {
            width: 100%;
            padding-top: 47.4%; /* 1294/2730≈0.474，即47.4% */
            position: relative;
            background: url(img/qqgf.png) no-repeat center/cover; /* 替换为实际图片路径 */
        }

        .banner a {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .banner-logo a {
            position: static; /* 重置 logo 链接的定位，若不需要可删除 */
        }

        /* 白色底栏区域：固定在页面最底部，左右铺满整个视口 */
        .footer {
            width: 100vw;
            margin-left: calc(50% - 50vw);   /* 抵消 body 左右内边距，铺满屏幕左右 */
            padding: 50px 0;
            background: #fff; /* 底栏改为白色 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #868787;

        }
        .footer-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .footer a {
            color: #868787;
            text-decoration: none;
        }
        .footer a:hover {
            color: #000;
        }
        .divider {
            color: #868787;
        }
    </style>
</head>

    <!-- 顶部标题 -->
    <header class="site-header">
        <h1 class="site-title"><img class="site-logo" src="book/logo.png" alt="秋秋工坊"></h1>
